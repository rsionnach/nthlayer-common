# Minimal copy of nthlayer-generate examples/services/payment-api.yaml
# (opensrm-wo62.4.1). Trimmed to the resources the overlay tests read:
# latency-p99, the Observability resource and the latency-p95 query are
# dropped; nothing else is changed.

service:
  name: payment-api
  team: payments
  tier: critical
  type: api
  language: java
  framework: spring-boot

resources:
  - kind: SLO
    name: availability
    spec:
      objective: 99.95
      window: 30d
      indicator:
        type: availability
        query: |
          sum(rate(http_requests{service="${service}",code!~"5.."}[5m]))
          /
          sum(rate(http_requests{service="${service}"}[5m]))

  - kind: SLO
    name: latency-p95
    spec:
      objective: 99.0
      window: 30d
      indicator:
        type: latency
        percentile: 95
        threshold_ms: 500

  - kind: PagerDuty
    name: primary
    spec:
      escalation_policy: payments-critical
      urgency: high
      auto_create: true

  - kind: Dependencies
    name: upstream
    spec:
      databases:
        - name: payments-db
          type: postgresql
          criticality: high
