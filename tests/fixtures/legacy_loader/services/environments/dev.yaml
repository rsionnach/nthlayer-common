# Copy of nthlayer-generate examples/services/environments/dev.yaml
# (opensrm-wo62.4.1), unchanged below this header except comments removed.

environment: dev

service:
  tier: low

resources:
  - kind: SLO
    name: availability
    spec:
      objective: 99.0

  - kind: SLO
    name: latency-p95
    spec:
      objective: 90.0
      threshold_ms: 2000

  - kind: PagerDuty
    name: primary
    spec:
      urgency: low
