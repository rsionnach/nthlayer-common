[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nthlayer-common"
version = "1.7.0"
description = "Shared utilities for the NthLayer ecosystem"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "structlog>=24.1.0",
    "pydantic>=2.7.0,<3.0.0",
    "pagerduty>=6.0.0,<7.0.0",
    "cachetools>=5.3.0,<7.0.0",
    "tenacity>=8.2.3,<10.0.0",
    "circuitbreaker>=2.0.0,<3.0.0",
    "instructor>=1.5",
    "anthropic>=0.40",
    "openai>=1.50",
    "opentelemetry-api>=1.28",
    "prometheus-client>=0.21",
    # Transitive pin: rich pulls pygments; CVE-2026-4539 fixed in 2.20.0
    # (opensrm-9uow.3 dependency audit). Remove once rich's lower bound
    # carries the fix transitively.
    "pygments>=2.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

# Ecosystem-wide ruff floor. E501 (line-too-long) and the full W family are
# tracked separately as hygiene calls and are deliberately not in the floor.
# Bead breadcrumb lives in CLAUDE.md "Lint conventions" if you want history.
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "SIM", "B"]
